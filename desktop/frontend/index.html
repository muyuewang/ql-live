<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻流直播</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h12M8 3v3M16 3v3"/><rect x="2" y="6" width="20" height="14" rx="2.5"/>
            <path d="M4 16h16"/><circle cx="12" cy="12" r="1" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="logo">轻流</span><span class="sub">直播</span>
        </div>
      </div>

      <!-- 分组下拉选择框 -->
      <div class="group-select" id="groupSelect">
        <button class="gs-trigger" id="gsTrigger">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span id="groupTitle">全部频道</span>
          <svg class="gs-caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="gs-menu" id="gsMenu"></div>
      </div>

      <!-- 搜索框 -->
      <div class="search-box">
        <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索频道…" spellcheck="false" />
      </div>

      <!-- 频道列表（纵向） -->
      <nav id="channelList" class="channel-list">
        <div class="empty">选择分组查看频道</div>
      </nav>

      <div class="sidebar-footer">
        <span class="dot"></span><span id="channelCount">0 个频道</span>
      </div>
    </aside>

    <main id="main">
      <div id="playerPanel">
        <div id="playerBar">
          <span id="nowTitle" class="now-title">未播放</span>
          <div class="player-bar-tools">
            <button id="refreshBtn" class="tool-btn" title="重新加载当前频道线路">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.64-6.36M21 3v6h-6"/></svg>
              <span>刷新</span>
            </button>
          </div>
        </div>
        <div id="videoWrap">
          <video id="video" controls playsinline autoplay></video>
          <div id="videoMsg" class="video-msg">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
            <span>点击左侧频道开始播放</span>
          </div>
          <div id="loadingOverlay" class="hidden">
            <div class="spinner"></div>
            <div id="loadingText">加载线路中…</div>
          </div>
        </div>
        <div id="toolbar">
          <button class="tool-btn" id="fullscreenBtn" title="全屏">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            <span>全屏</span>
          </button>
          <button class="tool-btn" id="favBtn" title="收藏/取消收藏本台">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>
            <span id="favBtnText">收藏</span>
          </button>
          <div class="line-select" id="lineSelect">
            <button class="tool-btn line-trigger" id="lineTrigger" title="切换线路">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
              <span id="lineTriggerText">线路</span>
              <svg class="line-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
            </button>
            <div class="line-menu" id="lineMenu"></div>
          </div>
          <div class="tool-sep"></div>
          <button class="tool-btn ico-only" id="epgBtn" title="查看节目单">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 4v3M17 4v3"/></svg>
            <span>节目单</span>
          </button>
          <button class="tool-btn ico-only" id="customBtn" title="自定义源">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20a8 8 0 100-16 8 8 0 000 16z"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg>
            <span>自定义源</span>
          </button>
          <button class="tool-btn ico-only" id="updateBtn" title="更新节目源">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7M21 4v4h-4"/></svg>
            <span>更新源</span>
          </button>
          <div class="tool-sep"></div>
          <button class="tool-btn" id="decodeBtn" title="切换解码模式">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M6 12h4M14 12h4M12 8v8"/></svg>
            <span id="decodeBtnText">解码</span>
          </button>
          <button class="tool-btn" id="aspectBtn" title="切换画面比例">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8h18M3 12h18M3 16h18"/></svg>
            <span id="aspectBtnText">比例</span>
          </button>
          <button class="tool-btn" id="autoLineBtn" title="卡顿自动换线">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>
            <span id="autoLineBtnText">换线</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- EPG 弹层 -->
  <div id="epgModal" class="modal hidden">
    <div class="modal-mask" data-close="epgModal"></div>
    <div class="modal-box">
      <div class="modal-head">
        <span id="epgTitle">节目单</span>
        <button class="modal-close" data-close="epgModal">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="epgBody" class="modal-body">
        <div class="empty">加载节目单中…</div>
      </div>
    </div>
  </div>

  <!-- 自定义源弹层 -->
  <div id="customModal" class="modal hidden">
    <div class="modal-mask" data-close="customModal"></div>
    <div class="modal-box">
      <div class="modal-head">
        <span>自定义源</span>
        <button class="modal-close" data-close="customModal">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="custom-add">
          <input id="customName" type="text" placeholder="名称（可选）" spellcheck="false" />
          <input id="customUrl" type="text" placeholder="直播地址 http/https/rtmp/rtsp" spellcheck="false" />
          <button class="btn btn-primary" id="customAddBtn">添加</button>
        </div>
        <div class="custom-import">
          <input id="customImportUrl" type="text" placeholder="远程 txt/m3u 地址，导入整列表" spellcheck="false" />
          <button class="btn" id="customImportBtn">导入</button>
        </div>
        <div id="customList" class="custom-list">
          <div class="empty">暂无自定义源</div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/hls.min.js"></script>
  <script src="js/app.js"></script>

  <!-- 换线/提示 toast -->
  <div id="toast"></div>
</body>
</html>
