[package]
name = "ql-live"
version = "1.0.0"
description = "轻流直播 Windows 桌面版 (Tauri)"
authors = ["muyuewang"]
edition = "2021"

# Tauri v2 靠 custom-protocol 区分开发/生产：dev = !custom-protocol。
# 不带这个特性编译出来的 exe 会去连 devUrl(localhost)，打包后必然 ERR_CONNECTION_REFUSED。
# 这里设为默认开启，任何 `cargo build`/`cargo tauri build` 都是生产模式；
# 真要做前端热更调试时用 `--no-default-features`。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
md5 = "0.7"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# 引擎桥接：getBstFk 需要 HmacSHA256，getJxtvKey 需要 CRC32
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1"
urlencoding = "2"
rand = "0.8"
chrono = "0.4"
# 引擎算法 JS 热更新：下载 js.zip 需要解压，执行需要内嵌 JS 引擎
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rquickjs = { version = "0.14", features = ["array-buffer", "classes"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
